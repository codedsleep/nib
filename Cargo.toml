[workspace]
members = ["crates/nib-core", "crates/nib-vault", "crates/nib"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/codedsleep/markdown-trekfm-rust"

[workspace.dependencies]
nib-core = { path = "crates/nib-core" }
nib-vault = { path = "crates/nib-vault" }
gtk4 = { version = "=0.11.5", features = ["v4_14"] }
glib = { version = "=0.22.10", features = ["v2_72"] }
gio = "=0.22.10"
gdk4 = "=0.11.5"
pango = "=0.22.8"
gdk-pixbuf = "=0.22.0"
sourceview5 = { version = "=0.11.2", features = ["v5_10"] }
pulldown-cmark = "=0.13.4"
nucleo = "=0.5.0"
nucleo-matcher = "=0.3.1"
ignore = "=0.4.33"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
toml = "=1.1.8"
chrono = "=0.4.45"
thiserror = "=2.0.21"
anyhow = "=1.0.103"
async-channel = "=2.5.0"
log = "=0.4.34"
unicode-segmentation = "=1.13.3"
tempfile = "=3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Configuration booleans represent independent user preferences.
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "unwind"
