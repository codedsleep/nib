name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      NIB_ALLOW_ROOTS: ''
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev scdoc
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
      - name: Verify tag and sources
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          scripts/forbidden-deps.sh
      - name: Build and package
        run: |
          cargo build --locked --release -p nib
          target/release/nib --version
          scripts/package.sh x86_64
          cd target/dist
          sha256sum nib-*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/dist/nib-*.tar.gz target/dist/SHA256SUMS \
            --verify-tag --title "nib $GITHUB_REF_NAME" --notes-file CHANGELOG.md
